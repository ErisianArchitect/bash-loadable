[package]
name = "bash-loadable-macros"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["proc-macro"]

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"

lolevel.workspace = true
libc.workspace = true
paste.workspace = true
fancy-regex.workspace = true
